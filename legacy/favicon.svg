<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EO favicon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18c8ff"/>
      <stop offset="100%" stop-color="#5b4dff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#accent)" stroke-width="2.5"/>

  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Inter, system-ui, sans-serif"
        font-size="29" font-weight="900" letter-spacing="-2"
        fill="#ffffff">EO</text>

  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Inter, system-ui, sans-serif"
        font-size="29" font-weight="900" letter-spacing="-2"
        fill="none" stroke="url(#accent)" stroke-width="1.35" opacity="0.95">EO</text>
  
  <circle cx="12" cy="12" r="3" fill="#18c8ff"/>
</svg>
